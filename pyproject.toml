[project]
name = "media-indexer"
version = "0.1.0"
description = "Semantic media search and management microservice powered by Qdrant and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "qdrant-client>=1.8.0",
    "yt-dlp>=2024.3.10",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.4",
    "requests>=2.31.0",
    "aiofiles>=23.2.1",
    "pymysql>=1.1.0",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    "rapidfuzz>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
media-indexer = "media_indexer.main:start"